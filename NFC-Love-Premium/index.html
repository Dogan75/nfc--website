<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ NFC Love Premium ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

</head>

<body>

<div id="hearts"></div>

<div class="background-blur"></div>

<section class="hero">

<img src="images/cover.jpg" class="cover">

<div class="overlay"></div>

<div class="hero-content">

<h1>❤️ Doğan & Ayşe ❤️</h1>

<p class="subtitle">
Birlikte yazılan en güzel hikâye...
</p>

<div class="counter">

<h2>Birlikte</h2>

<span id="days">0</span>

<p>Gündür...</p>

</div>

<a href="#gallery" class="scroll-btn">

Aşağı Kaydır ❤️

</a>

</div>

</section>

<section id="gallery">

<h2 class="title">

Fotoğraf Galerisi

</h2>

<div class="gallery">

<img src="images/1.jpg" class="photo">

<img src="images/2.jpg" class="photo">

<img src="images/3.jpg" class="photo">

<img src="images/4.jpg" class="photo">

</div>

</section>

<section class="buttons">

<button id="musicBtn" class="btn">

🎵 Şarkımız

</button>

<button id="videoBtn" class="btn">

🎥 Videomuz

</button>

<button id="letterBtn" class="btn">

💌 Sana Özel

</button>

<button id="giftBtn" class="btn">

🎁 Sürpriz

</button>

<a class="btn"
href="#">

📷 Instagram

</a>

<a class="btn"
href="#">

💬 WhatsApp

</a>

</section>

<div id="popup" class="popup">

<div class="popup-box">

<span class="close">&times;</span>

<h2>💌</h2>

<p>

Seninle geçen her an
hayatımın en güzel anısı...

❤️

</p>

</div>

</div><div id="giftPopup" class="popup">

    <div class="popup-box">

        <span class="giftClose">&times;</span>

        <h2>🎁 Sürpriz</h2>

        <p>

            Hayatımın en güzel hediyesi sensin. ❤️

        </p>

    </div>

</div>

<div id="lightbox" class="lightbox">

    <span id="closeLightbox">&times;</span>

    <img id="lightboxImg" src="" alt="Fotoğraf">

</div>

<audio id="player">

    <source src="music/song.mp3" type="audio/mpeg">

</audio>

<video id="videoPlayer" controls style="display:none;">

    <source src="video/video.mp4" type="video/mp4">

</video>

<footer>

    <p>

        ❤️ Sonsuza kadar birlikte...

    </p>

</footer>

<script src="script.js"></script>

</body>

</html>
